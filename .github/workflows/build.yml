          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#007A3D" android:pathData="M27,36 L81,36 L81,48 L27,48 Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M27,48 L81,48 L81,60 L27,60 Z"/>
              <path android:fillColor="#000000" android:pathData="M27,60 L81,60 L81,72 L27,72 Z"/>
              <path android:fillColor="#CE1126" android:pathData="M40.50,49.60 L41.53,52.58 L44.68,52.64 L42.17,54.54 L43.09,57.56 L40.50,55.76 L37.91,57.56 L38.83,54.54 L36.32,52.64 L39.47,52.58 Z"/>
              <path android:fillColor="#CE1126" android:pathData="M54.00,49.60 L55.03,52.58 L58.18,52.64 L55.67,54.54 L56.59,57.56 L54.00,55.76 L51.41,57.56 L52.33,54.54 L49.82,52.64 L52.97,52.58 Z"/>
              <path android:fillColor="#CE1126" android:pathData="M67.50,49.60 L68.53,52.58 L71.68,52.64 L69.17,54.54 L70.09,57.56 L67.50,55.76 L64.91,57.56 L65.83,54.54 L63.32,52.64 L66.47,52.58 Z"/>
