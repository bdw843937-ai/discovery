name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Generate project
        run: |
          mkdir -p app/src/main/java/com/example/discovery
          cat > settings.gradle.kts <<'EOF_0'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Discovery"
          include(":app")
          EOF_0
          cat > build.gradle.kts <<'EOF_1'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.20" apply false
          }
          EOF_1
          cat > gradle.properties <<'EOF_2'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g
          EOF_2
          cat > app/build.gradle.kts <<'EOF_3'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "com.example.discovery"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.discovery"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildFeatures { compose = true }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.5")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.5")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          EOF_3
          cat > app/src/main/AndroidManifest.xml <<'EOF_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE"/>
              <application
                  android:label="Discovery"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_4
          cat > app/src/main/java/com/example/discovery/MainActivity.kt <<'EOF_5'
          package com.example.discovery

          import android.app.Application
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.unit.dp
          import androidx.lifecycle.AndroidViewModel
          import androidx.lifecycle.viewModelScope
          import androidx.lifecycle.viewmodel.compose.viewModel
          import kotlinx.coroutines.launch

          class DiscoveryViewModel(app: Application) : AndroidViewModel(app) {
              var devices by mutableStateOf<List<Device>>(emptyList())
                  private set
              var scanning by mutableStateOf(false)
                  private set
              var error by mutableStateOf<String?>(null)
                  private set

              fun scan() {
                  if (scanning) return
                  val ip = Scanner.localIp(getApplication())
                  if (ip == null) { error = "اتصل بشبكة Wi-Fi أولاً"; return }
                  error = null; devices = emptyList(); scanning = true
                  viewModelScope.launch {
                      // 1) أجهزة Ubiquiti أولاً (سريع)
                      Scanner.ubiquitiDiscovery().forEach { add(it) }
                      // 2) ثم فحص باقي الشبكة
                      Scanner.sweep(ip) { add(it) }
                      scanning = false
                  }
              }

              @Synchronized
              private fun add(d: Device) {
                  val old = devices.find { it.ip == d.ip }
                  devices = (devices.filter { it.ip != d.ip } + (old?.let { merge(it, d) } ?: d))
                      .sortedBy { it.ip.substringAfterLast(".").toInt() }
              }

              private fun merge(a: Device, b: Device) = Device(
                  a.ip, a.mac.ifEmpty { b.mac }, a.name.ifEmpty { b.name },
                  a.model.ifEmpty { b.model }, a.firmware.ifEmpty { b.firmware },
                  (a.ports + b.ports).distinct(), a.ubiquiti || b.ubiquiti
              )
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent { MaterialTheme { Screen() } }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun Screen(vm: DiscoveryViewModel = viewModel()) {
              val ctx = LocalContext.current
              var query by remember { mutableStateOf("") }
              val list = vm.devices.filter {
                  query.isBlank() || listOf(it.ip, it.name, it.model, it.mac)
                      .any { f -> f.contains(query, ignoreCase = true) }
              }
              LaunchedEffect(Unit) { vm.scan() }

              Scaffold(
                  topBar = { TopAppBar(title = { Text("Discovery") }) },
                  floatingActionButton = {
                      ExtendedFloatingActionButton(onClick = { vm.scan() }) {
                          Text(if (vm.scanning) "جارٍ الفحص..." else "فحص")
                      }
                  }
              ) { pad ->
                  Column(Modifier.padding(pad).padding(12.dp)) {
                      OutlinedTextField(
                          value = query, onValueChange = { query = it },
                          label = { Text("بحث (IP / اسم / MAC)") },
                          singleLine = true, modifier = Modifier.fillMaxWidth()
                      )
                      if (vm.scanning) LinearProgressIndicator(Modifier.fillMaxWidth().padding(vertical = 8.dp))
                      vm.error?.let { Text(it, color = MaterialTheme.colorScheme.error) }
                      Text("${list.size} جهاز", Modifier.padding(vertical = 4.dp))
                      LazyColumn(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                          items(list, key = { it.ip }) { d ->
                              Card(Modifier.fillMaxWidth().clickable {
                                  val scheme = if (443 in d.ports && 80 !in d.ports) "https" else "http"
                                  ctx.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("$scheme://${d.ip}")))
                              }) {
                                  Column(Modifier.padding(12.dp)) {
                                      Text(d.name.ifEmpty { d.ip }, style = MaterialTheme.typography.titleMedium)
                                      Text("IP: ${d.ip}")
                                      if (d.mac.isNotEmpty()) Text("MAC: ${d.mac}")
                                      if (d.model.isNotEmpty()) Text("الموديل: ${d.model}")
                                      if (d.firmware.isNotEmpty()) Text("الفيرموير: ${d.firmware}")
                                      if (d.ports.isNotEmpty()) Text("المنافذ: ${d.ports.joinToString()}")
                                      if (d.ubiquiti) AssistChip(onClick = {}, label = { Text("Ubiquiti") })
                                  }
                              }
                          }
                      }
                  }
              }
          }

          EOF_5
          cat > app/src/main/java/com/example/discovery/Scanner.kt <<'EOF_6'
          package com.example.discovery

          import android.content.Context
          import android.net.ConnectivityManager
          import kotlinx.coroutines.*
          import kotlinx.coroutines.sync.Semaphore
          import kotlinx.coroutines.sync.withPermit
          import java.net.*

          data class Device(
              val ip: String,
              val mac: String = "",
              val name: String = "",
              val model: String = "",
              val firmware: String = "",
              val ports: List<Int> = emptyList(),
              val ubiquiti: Boolean = false
          )

          object Scanner {

              /** عنوان IP المحلي للجهاز على شبكة Wi-Fi */
              fun localIp(ctx: Context): String? {
                  val cm = ctx.getSystemService(ConnectivityManager::class.java)
                  val lp = cm.getLinkProperties(cm.activeNetwork) ?: return null
                  return lp.linkAddresses.map { it.address }
                      .firstOrNull { it is Inet4Address && !it.isLoopbackAddress }?.hostAddress
              }

              /** اكتشاف أجهزة Ubiquiti عبر UDP broadcast على المنفذ 10001 */
              suspend fun ubiquitiDiscovery(): List<Device> = withContext(Dispatchers.IO) {
                  val found = mutableMapOf<String, Device>()
                  try {
                      DatagramSocket().use { s ->
                          s.broadcast = true
                          s.soTimeout = 1500
                          val req = byteArrayOf(0x01, 0x00, 0x00, 0x00)
                          s.send(DatagramPacket(req, req.size, InetAddress.getByName("255.255.255.255"), 10001))
                          val buf = ByteArray(2048)
                          while (true) {
                              val p = DatagramPacket(buf, buf.size)
                              try { s.receive(p) } catch (e: SocketTimeoutException) { break }
                              val ip = p.address.hostAddress ?: continue
                              found[ip] = parse(buf, p.length, ip)
                          }
                      }
                  } catch (_: Exception) {}
                  found.values.toList()
              }

              private fun parse(d: ByteArray, len: Int, ip: String): Device {
                  var i = 4
                  var mac = ""; var name = ""; var model = ""; var fw = ""
                  while (i + 3 <= len) {
                      val t = d[i].toInt() and 0xFF
                      val l = ((d[i + 1].toInt() and 0xFF) shl 8) or (d[i + 2].toInt() and 0xFF)
                      i += 3
                      if (i + l > len) break
                      val v = d.copyOfRange(i, i + l)
                      when (t) {
                          0x01 -> if (l >= 6) mac = v.take(6).joinToString(":") { "%02X".format(it) }
                          0x0B -> name = String(v)
                          0x0C -> if (model.isEmpty()) model = String(v)
                          0x14 -> model = String(v)
                          0x03 -> fw = String(v)
                      }
                      i += l
                  }
                  return Device(ip, mac, name, model, fw, ubiquiti = true)
              }

              /** فحص النطاق /24 بالكامل (Ping + منافذ شائعة) */
              suspend fun sweep(localIp: String, onFound: (Device) -> Unit) = coroutineScope {
                  val prefix = localIp.substringBeforeLast(".")
                  val sem = Semaphore(64)
                  (1..254).map { n ->
                      async(Dispatchers.IO) {
                          sem.withPermit {
                              val ip = "$prefix.$n"
                              val addr = InetAddress.getByName(ip)
                              val ports = listOf(22, 80, 443, 8080).filter { openPort(ip, it) }
                              val alive = ports.isNotEmpty() || runCatching { addr.isReachable(300) }.getOrDefault(false)
                              if (alive) {
                                  val host = runCatching { addr.canonicalHostName }.getOrDefault(ip)
                                  onFound(Device(ip, name = if (host != ip) host else "", ports = ports))
                              }
                          }
                      }
                  }.awaitAll()
              }

              private fun openPort(ip: String, port: Int): Boolean = try {
                  Socket().use { it.connect(InetSocketAddress(ip, port), 250); true }
              } catch (_: Exception) { false }
          }

          EOF_6
      - name: Build
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Discovery-APK
          path: app/build/outputs/apk/debug/app-debug.apk
